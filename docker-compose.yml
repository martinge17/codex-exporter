services:
  codex-exporter:
    image: ghcr.io/martinge17/codex-exporter:latest
    container_name: codex-exporter
    restart: unless-stopped
    ports:
      - 9212:9212
    volumes:
      - codex-exporter:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  codex-exporter:
