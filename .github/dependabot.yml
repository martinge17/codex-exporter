version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: daily
      time: "04:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      python-app:
        patterns:
          - fastapi
          - httpx
          - uvicorn
      python-dev:
        patterns:
          - coverage
          - pytest
          - ruff

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
      time: "04:10"
      timezone: Etc/UTC
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "04:20"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
